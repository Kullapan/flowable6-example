server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/flowable_engine
spring.datasource.username=flowable
spring.datasource.password=flowable
spring.datasource.driver-class-name=org.postgresql.Driver

# Flowable REST Configuration
flowable.rest.app.process.engine-configurer.idm-enabled=true
flowable.rest.app.process.engine-configurer.rest-api-enabled=true

# Security (Simple Basic Auth for dev)
spring.security.user.name=admin
spring.security.user.password=test

# Spring JPA (optional, Flowable manages its own tables)
spring.jpa.hibernate.ddl-auto=none
