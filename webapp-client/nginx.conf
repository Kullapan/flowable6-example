# =============================================================================
# nginx.conf — webapp-client
# Placed at /etc/nginx/conf.d/default.conf inside the container.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for the React build output.
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    # Reduces transfer size of JS/CSS bundles significantly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite hashes asset filenames on build, so it is safe to cache them for a
    # long time.  This dramatically improves repeat-visit load times.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # Any request from the React app to /api/* is forwarded to the backend
    # container on the shared Docker network.  The frontend never calls the
    # backend on an external port — all traffic stays inside the network.
    location /api/ {
        proxy_pass         http://custom-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long-running backend operations.
        proxy_read_timeout  90s;
        proxy_connect_timeout 10s;
    }

    # ── React Router support ──────────────────────────────────────────────────
    # All paths that don't match a real file are served index.html so that
    # client-side routing (React Router) can handle navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
